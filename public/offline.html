<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Офлайн — Рыбалка в Прикамье</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, 'Times New Roman', serif;
        background: linear-gradient(160deg, #0f172a, #1e3a5f 55%, #0ea5e9);
        color: #e2e8f0;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 1.6rem; margin-bottom: 8px; }
      p { opacity: 0.85; max-width: 28rem; margin: 0 auto 18px; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        font-family: system-ui, sans-serif;
      }
      a {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        background: #3b82f6;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      a.sos {
        background: #b91c1c;
      }
      a.ghost {
        background: transparent;
        border: 1px solid rgba(226, 232, 240, 0.45);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Нет сети</h1>
      <p>
        Можно открыть ранее посещённые разделы и карту из кэша.
        Вызов спасателей работает без интернета.
      </p>
      <div class="actions">
        <a class="sos" href="tel:112">Позвонить 112</a>
        <a class="sos" href="tel:112">SOS</a>
        <a href="/map">Карта</a>
        <a class="ghost" href="/">На главную</a>
      </div>
    </div>
  </body>
</html>
