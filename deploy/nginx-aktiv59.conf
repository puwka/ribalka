# SPA + real HTTP 404 for unknown paths (Yandex Webmaster soft-404 fix)
#
# Install:
#   sudo cp deploy/nginx-aktiv59.conf /etc/nginx/sites-available/aktiv59
#   # merge SSL paths with your existing certs, then:
#   sudo ln -sf /etc/nginx/sites-available/aktiv59 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Check:
#   curl -sI https://aktiv59.ru/no-such-page | head -1   → 404
#   curl -sI https://aktiv59.ru/forum | head -1          → 200
#
# map must live in http{} — this file is included from sites-enabled inside http.

map $uri $spa_try {
    default /__spa_404;
    ~*^/$ /index.html;
    ~*^/(about|map|tariffs|lunar|calendar|favorites)/?$ /index.html;
    ~*^/(paid-waters|free-waters)/?$ /index.html;
    ~*^/(login|register|forgot-password|reset-password)/?$ /index.html;
    ~*^/(news|waters|bases|directory|reports|forum|u)(/|$) /index.html;
    ~*^/(paid-bases|free-places)(/|$) /index.html;
    ~*^/(cabinet|owner|admin)(/|$) /index.html;
}

server {
    listen 443 ssl http2;
    server_name aktiv59.ru www.aktiv59.ru;
    root /var/www/rybalka/dist;
    index index.html;

    # ssl_certificate     /etc/letsencrypt/live/aktiv59.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aktiv59.ru/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Existing files as-is; known SPA routes → index.html (200);
    # everything else → internal 404 → index.html with status 404
    location / {
        try_files $uri $uri/ $spa_try;
    }

    location = /__spa_404 {
        internal;
        return 404;
    }

    error_page 404 =404 /index.html;
}

server {
    listen 80;
    server_name aktiv59.ru www.aktiv59.ru;
    return 301 https://$host$request_uri;
}
